<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTL 설비 배치도</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px;color:#1e293b;background:#eef1f5;overflow:hidden}
#app{display:grid;grid-template-columns:200px 1fr 240px;grid-template-rows:48px 1fr;height:100%}
header{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:#1e3a5f;color:#fff;overflow-x:auto;white-space:nowrap}
header h1{font-size:15px;margin:0 10px 0 0}
header input#title{background:#2c4d77;border:1px solid #46699a;color:#fff;padding:5px 8px;border-radius:4px;width:180px}
button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;background:#fff;color:#1e293b;padding:5px 9px;border-radius:4px}
button:hover{background:#f1f5f9}
header button{background:#2c4d77;border-color:#46699a;color:#fff}
header button:hover{background:#3a6090}
header .sep{width:1px;height:24px;background:#46699a;margin:0 4px}
aside{background:#fff;overflow-y:auto;padding:10px}
#left{border-right:1px solid #dbe1e8}
#right{border-left:1px solid #dbe1e8}
aside h3{font-size:12px;margin:12px 0 6px;color:#475569;border-bottom:1px solid #e2e8f0;padding-bottom:4px}
aside h3:first-child{margin-top:0}
.pal{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:5px;text-align:left;padding:7px 8px}
.pal i{display:inline-block;width:14px;height:14px;border-radius:3px;flex:none}
.pal span{flex:1}
.pal small{color:#64748b}
#stage{position:relative;overflow:hidden;background:#e5e9ef;touch-action:none}
#svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.panning{cursor:grabbing}
.zoombar{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.zoombar button{width:34px;height:34px;padding:0;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#hint{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:4px;font-size:11px;color:#475569}
.prop label{display:block;font-size:11px;color:#64748b;margin:8px 0 2px}
.prop input,.prop select,.prop textarea{width:100%;font:inherit;padding:5px 6px;border:1px solid #cbd5e1;border-radius:4px}
.prop .row{display:flex;gap:6px}.prop .row>div{flex:1}
.prop .btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.empty{color:#94a3b8;font-size:12px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{border-bottom:1px solid #eef1f5;padding:4px 3px;text-align:left}
td:last-child,th:last-child{text-align:right}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:10}
.modal.on{display:flex}
.modal>div{background:#fff;border-radius:8px;padding:16px;width:min(720px,94vw);max-height:90vh;overflow:auto}
.modal textarea{width:100%;height:260px;font-family:monospace;font-size:12px}
.modal img{max-width:100%;border:1px solid #e2e8f0}
.modal .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
#stat{font-size:12px;color:#cbd5e1;margin-left:6px}
#stat b{color:#fbbf24;font-weight:normal}
.cmpbox{width:96vw!important;height:92vh;max-height:none!important;display:flex;flex-direction:column;gap:8px}
.cmpbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmpbar select{font:inherit;padding:5px;border:1px solid #cbd5e1;border-radius:4px;max-width:220px}
.cmpbar .on{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
#cmpView{flex:1;min-height:260px;display:flex;gap:10px}
#cmpView>div{flex:1;display:flex;flex-direction:column;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden;min-width:0}
#cmpView>div>b{padding:5px 8px;background:#f1f5f9;font-size:13px}
#cmpView svg{flex:1;width:100%;min-height:0}
#cmpDiff{max-height:32vh;overflow:auto;font-size:12px}
#cmpDiff table td,#cmpDiff table th{text-align:left;white-space:nowrap}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;color:#fff;font-size:11px}
#lsTbl td{vertical-align:middle}
#lsTbl tr.cur td{background:#fff7ed}
@media (max-width:900px){ #cmpView{flex-direction:column} }
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:7px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:.92}
/* [추가] 의견(같이 보며 이야기) 패널 */
#talkPanel{position:fixed;top:48px;right:0;bottom:0;width:340px;background:#fff;border-left:1px solid #dbe1e8;box-shadow:-4px 0 14px rgba(15,23,42,.12);display:none;flex-direction:column;z-index:9}
#talkPanel.on{display:flex}
.tp-h{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.tp-h b{font-size:14px}
.tp-f{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid #eef1f5;font-size:12px;color:#64748b}
.tp-f select{font:inherit;padding:3px 5px;border:1px solid #cbd5e1;border-radius:4px}
#tpList{flex:1;overflow-y:auto;padding:8px 10px}
.tp-it{border:1px solid #e2e8f0;border-radius:6px;padding:7px 8px;margin-bottom:7px;background:#fff}
.tp-it.done{opacity:.6;background:#f8fafc}
.tp-it.hi{border-color:#f97316;box-shadow:0 0 0 2px #fed7aa}
.tp-m{font-size:12px;color:#334155;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tp-m small{color:#94a3b8}
.tp-no{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:#dc2626;color:#fff;font-size:11px;font-weight:bold;padding:0 5px}
.tp-it.done .tp-no{background:#94a3b8}
.tp-t{white-space:pre-wrap;word-break:break-all;margin:5px 0;line-height:1.45}
.tp-a{display:flex;gap:4px;flex-wrap:wrap}.tp-a button{padding:2px 7px;font-size:11px}
.tp-new{border-top:1px solid #e2e8f0;padding:8px 10px;background:#f8fafc}
.tp-new input,.tp-new textarea{width:100%;font:inherit;padding:5px 6px;border:1px solid #cbd5e1;border-radius:4px;margin-bottom:5px}
.tp-new .btns{display:flex;gap:5px;align-items:center}
#tpPos{font-size:11px;color:#c2410c}
#tpPin.on{background:#f97316;color:#fff;border-color:#f97316}
#rbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:6px 10px;border-radius:6px;display:none;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:5;font-size:12px}
#rbar.on{display:flex}
#pickTip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:6px 12px;border-radius:6px;display:none;z-index:5;font-size:12px}
#pickTip.on{display:block}
@media (max-width:900px){ #talkPanel{top:auto;left:0;width:100%;height:62vh;border-left:0;border-top:1px solid #dbe1e8;border-radius:10px 10px 0 0} }
@media print{ #talkPanel,#rbar,#pickTip{display:none!important} }
/* 모바일·태블릿 */
@media (max-width:900px){
 #app{grid-template-columns:1fr;grid-template-rows:48px auto 1fr auto}
 header{grid-column:1}
 #left{border:0;border-bottom:1px solid #dbe1e8;max-height:none;display:flex;gap:5px;overflow-x:auto;padding:6px;white-space:nowrap}
 #left h3,#left .lg{display:none}
 #left .pal{width:auto;margin:0;flex:none}
 #left>div:not(.prop){display:flex;gap:5px;flex:none}   /* [추가] 문·설비 버튼을 한 줄로 */
 #right{border:0;border-top:1px solid #dbe1e8;max-height:38vh}
 #hint{display:none}
}
@media print{
 header,aside,.zoombar,#hint{display:none!important}
 #app{display:block}#stage{position:fixed;inset:0;background:#fff}
}
</style>
</head>
<body>
<div id="app">
<header>
 <h1>설비 배치도</h1>
 <input id="title" value="NTL 공장 설비 배치도" title="도면 제목">
 <span class="sep"></span>
 <button id="bZone">＋ 장소</button>
 <button id="bUndo" title="Ctrl+Z">↶ 되돌리기</button>
 <button id="bSnap">격자맞춤: 켜짐</button>
 <button id="bArt">표시: 그림</button>
 <button id="bMulti" title="켜면 터치로 여러 개 선택(탭=추가/해제, 빈 곳 드래그=범위 선택)">다중선택: 끔</button>
 <span class="sep"></span>
 <button id="bFit">전체보기</button>
 <button id="bPng">이미지</button>
 <button id="bPrint">인쇄</button>
 <button id="bExport">내보내기</button>
 <button id="bImport">불러오기</button>
 <span class="sep"></span>
 <button id="bSave" title="Ctrl+S">저장</button>
 <button id="bList">도면 목록</button>
 <button id="bCmp">전후 비교</button>
 <button id="bTalk" title="도면에 위치를 찍어 의견 남기기 — QMS 사용자 모두 같이 봄">💬 의견 <span id="talkN"></span></button>
 <span id="stat"></span>
</header>

<aside id="left">
 <h3>장소</h3>
 <button class="pal" data-zone="1"><i style="background:#dbeafe;border:1px dashed #3b82f6"></i><span>장소(구역)</span></button>
 <h3>문</h3>
 <div id="palDoor"></div>
 <h3>가공 설비</h3>
 <div id="palMach"></div>
 <h3>검사 설비</h3>
 <div id="palInsp"></div>
 <h3 class="lg">공장 크기 (m)</h3>
 <div class="prop lg"><div class="row">
  <div><input id="floorW" type="number" min="10" step="1"></div>
  <div><input id="floorH" type="number" min="10" step="1"></div>
 </div></div>
</aside>

<main id="stage">
 <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
 <div id="hint">클릭=추가 · 드래그=이동 · 모서리=크기 · 빈 곳 드래그=화면이동 · 휠=확대 · Shift+클릭/드래그=여러 개 선택 · Del=삭제 · R=회전 · Ctrl+D=복제</div>
 <div id="rbar"><span id="rbarT"></span><button id="rbarLoad">새로 불러오기</button><button id="rbarHide">닫기</button></div>
 <div id="pickTip">📍 의견을 남길 위치를 도면에서 누르세요 (Esc = 취소)</div>
 <div class="zoombar"><button id="zIn">＋</button><button id="zOut">－</button></div>
</main>

<aside id="right">
 <h3>속성</h3>
 <div id="prop" class="prop"></div>
 <h3>설비 현황</h3>
 <div id="summary"></div>
</aside>
</div>

<div class="modal" id="mJson"><div>
 <b id="mJsonT">내보내기</b>
 <p class="empty" id="mJsonD"></p>
 <textarea id="jsonTxt"></textarea>
 <div class="btns"><button id="jsonFile" style="display:none">파일 선택</button><input type="file" id="jsonFileIn" accept=".json,application/json" style="display:none"><button id="jsonCopy">복사</button><button id="jsonSave">파일로 저장</button><button id="jsonOk">불러오기</button><button id="jsonClose">닫기</button></div>
</div></div>
<div class="modal" id="mImg"><div>
 <b>배치도 이미지</b>
 <p class="empty">이미지를 마우스 오른쪽 클릭(모바일은 길게 누르기) → "이미지 저장"으로 저장하세요.</p>
 <img id="pngImg" alt="배치도">
 <div class="btns"><button id="pngDown">PNG 다운로드</button><button onclick="closeM('mImg')">닫기</button></div>
</div></div>
<div class="modal" id="mConfirm"><div style="width:min(360px,90vw)">
 <b id="cfMsg"></b>
 <div class="btns"><button id="cfYes">확인</button><button onclick="closeM('mConfirm')">취소</button></div>
</div></div>
<div class="modal" id="mList"><div>
 <b>도면 목록</b>
 <p class="empty" id="lsMode"></p>
 <div class="prop"><label>현재 도면 이름</label><input id="lsName"></div>
 <div class="btns" style="justify-content:flex-start"><button id="lsSave">저장</button><button id="lsSaveNew">새 도면으로 저장(복사본)</button><button id="bNew">새 도면 시작</button></div>
 <table id="lsTbl" style="margin-top:12px"></table>
 <div class="btns"><button onclick="closeM('mList')">닫기</button></div>
</div></div>
<div class="modal" id="mCmp"><div class="cmpbox">
 <div class="cmpbar">
  <b>전후 비교</b>
  이전 <select id="cA"></select> → 이후 <select id="cB"></select>
  <button id="cSide" class="on">나란히</button><button id="cOver">겹쳐보기</button>
  <span style="flex:1"></span>
  <button id="cPng">이미지 저장</button><button id="cPpt" style="background:#C43E1C;color:#fff;border-color:#C43E1C">PPT 다운로드</button><button id="cCsv">변경내역 CSV</button><button onclick="closeM('mCmp')">닫기</button>
 </div>
 <div id="cmpView"></div>
 <div id="cmpDiff"></div>
</div></div>
<div id="toast"></div>
<div id="talkPanel">
 <div class="tp-h"><b>💬 의견</b><span id="tpTitle" class="empty"></span><span style="flex:1"></span><button id="tpClose">✕</button></div>
 <div class="tp-f"><select id="tpFilter"><option value="open">미해결만</option><option value="all">전체</option></select><span id="tpCnt"></span></div>
 <div id="tpList"></div>
 <div class="tp-new" id="tpNew">
  <input id="tpWho" placeholder="이름 (작성자)">
  <textarea id="tpText" rows="3" placeholder="의견을 입력하세요 (예: 이 MCT는 통로 쪽으로 1m 옮기면 좋겠음)"></textarea>
  <div class="btns"><button id="tpPin">📍 위치 찍기</button><span id="tpPos"></span><span style="flex:1"></span><button id="tpAdd" style="background:#1e3a5f;color:#fff;border-color:#1e3a5f">등록</button></div>
 </div>
</div>

<script>
'use strict';
const S = 40;               // 1m = 40px (world 단위)
const KEY = 'ntl_layout_v1';
const TYPES = {
 MCT:      {cat:'mach', label:'MCT',        w:2.5, h:2.2, color:'#3b82f6'},
 BIGMCT:   {cat:'mach', label:'대형 MCT',   w:4.5, h:3.5, color:'#1d4ed8'},
 HORI:     {cat:'mach', label:'호리젠탈',   w:3.5, h:3.0, color:'#6366f1'},
 LATHE:    {cat:'mach', label:'선반',       w:3.0, h:1.8, color:'#f59e0b'},
 BIGLATHE: {cat:'mach', label:'대형선반',   w:6.0, h:2.5, color:'#ca8a04'},
 VTL:      {cat:'mach', label:'수직선반',   w:3.5, h:3.5, color:'#ea580c'},
 CNC:      {cat:'mach', label:'CNC',        w:2.5, h:2.0, color:'#10b981'},
 MILL:     {cat:'mach', label:'밀링',       w:2.0, h:1.8, color:'#8b5cf6'},
 CMM:      {cat:'insp', label:'3차원측정기', w:2.0, h:3.0, color:'#ef4444'},
 VISION:   {cat:'insp', label:'비젼측정기', w:1.2, h:1.0, color:'#ec4899'},
 LEAK:     {cat:'insp', label:'LEAK TEST기',w:1.2, h:0.8, color:'#14b8a6'}
};
/* 장비 평면(위에서 본) 그림 — 기본 크기 기준 10cm 단위 좌표, 위쪽 = 정면 */
const ST = 'stroke="#475569" stroke-width=".25"';
const ART = {
 MCT: [25,22, c=>`<rect x="1" y="2.5" width="19" height="17.5" rx="1" fill="#e2e8f0" ${ST}/>
  <rect x="3" y=".6" width="15" height="2.4" rx=".4" fill="#bfdbfe" ${ST}/><line x1="10.5" y1=".6" x2="10.5" y2="3" ${ST}/>
  <rect x="6.5" y="6.5" width="8" height="8" rx=".6" fill="#94a3b8" ${ST}/><circle cx="10.5" cy="10.5" r="2.4" fill="#475569"/><circle cx="10.5" cy="10.5" r=".9" fill="${c}"/>
  <rect x="6" y="19.6" width="9" height="2.2" fill="#94a3b8" ${ST}/><path d="M7 19.6v2.2M8.5 19.6v2.2M10 19.6v2.2M11.5 19.6v2.2M13 19.6v2.2" ${ST}/>
  <rect x="20.4" y="3.5" width="4.2" height="8" rx=".4" fill="#334155"/><rect x="21" y="4.2" width="3" height="2.6" fill="${c}"/>
  <circle cx="21.7" cy="8.6" r=".45" fill="#fbbf24"/><circle cx="23.2" cy="8.6" r=".45" fill="#ef4444"/><rect x="21" y="9.7" width="3" height="1.1" fill="#64748b"/>`],
 BIGMCT: [45,35, c=>`<rect x="1" y="3" width="36" height="30" rx="1" fill="#e2e8f0" ${ST}/>
  <rect x="4" y=".6" width="30" height="2.8" rx=".4" fill="#bfdbfe" ${ST}/><path d="M14 .6v2.8M24 .6v2.8" ${ST}/>
  <rect x="5" y="9" width="28" height="13" fill="#cbd5e1" ${ST}/><path d="M5 12.2h28M5 15.5h28M5 18.8h28" stroke="#94a3b8" stroke-width=".3"/>
  <rect x="14.5" y="11" width="9" height="9" rx=".6" fill="#64748b" ${ST}/><circle cx="19" cy="15.5" r="2.8" fill="#334155"/><circle cx="19" cy="15.5" r="1.1" fill="${c}"/>
  <rect x="6" y="25" width="26" height="6" fill="#94a3b8" ${ST}/><path d="M8 25v6M11 25v6M14 25v6M17 25v6M20 25v6M23 25v6M26 25v6M29 25v6" ${ST}/>
  <rect x="38" y="4" width="6.2" height="11" rx=".4" fill="#334155"/><rect x="38.7" y="4.8" width="4.8" height="3.6" fill="${c}"/>
  <circle cx="39.8" cy="10.5" r=".6" fill="#fbbf24"/><circle cx="42.2" cy="10.5" r=".6" fill="#ef4444"/><rect x="38.7" y="12.2" width="4.8" height="1.6" fill="#64748b"/>`],
 BIGLATHE: [60,25, c=>`<rect x="2" y="7" width="56" height="12" fill="#e2e8f0" ${ST}/><path d="M14 9h43M14 17h43" ${ST}/>
  <rect x="1" y="3.5" width="12" height="19" rx=".6" fill="#94a3b8" ${ST}/>
  <circle cx="15.5" cy="13" r="5.6" fill="#cbd5e1" ${ST}/><circle cx="15.5" cy="13" r="1.5" fill="#475569"/>
  <path d="M15.5 7.8v3M15.5 15.2v3M11 15.6l2.6-1.5M20 10.4l-2.6 1.5" stroke="#334155" stroke-width=".9"/>
  <rect x="27" y="4" width="8" height="18" fill="#cbd5e1" ${ST}/><rect x="29.2" y="10.8" width="3.6" height="3.6" fill="${c}"/><circle cx="31" cy="23.2" r="1.6" fill="none" ${ST}/>
  <rect x="48" y="8.5" width="8.5" height="9" rx=".6" fill="#94a3b8" ${ST}/><rect x="46" y="12" width="2" height="2" fill="#64748b"/>
  <rect x="2" y="22.3" width="8" height="2.4" fill="#334155"/><path d="M2 21h56" stroke="#64748b" stroke-width=".4"/>`],
 VTL: [35,35, c=>`<rect x="2" y="3" width="31" height="24" rx="1" fill="#e2e8f0" ${ST}/>
  <circle cx="17.5" cy="14.5" r="11" fill="#cbd5e1" ${ST}/><circle cx="17.5" cy="14.5" r="7.5" fill="none" stroke="#94a3b8" stroke-width=".3"/>
  ${[0,90,180,270].map(a=>`<rect x="16.6" y="4.5" width="1.8" height="3" fill="#475569" transform="rotate(${a} 17.5 14.5)"/>`).join('')}
  <circle cx="17.5" cy="14.5" r="1.4" fill="#64748b"/>
  <rect x="1" y="27" width="7" height="7" fill="#64748b" ${ST}/><rect x="27" y="27" width="7" height="7" fill="#64748b" ${ST}/>

function nextNo(type){

// 문을 가장 가까운 벽(공장 외벽·장소 경계)에 붙이고 방향 자동 설정
function snapDoor(i){
 const cx=i.x+i.w/2, cy=i.y+i.h/2, L=[];
 [{x:0,y:0,w:D.floorW,h:D.floorH}, ...D.items.filter(z=>z.kind==='zone')].forEach(r=>{
  L.push({o:'h',v:r.y,a:r.x,b:r.x+r.w,rot:0},{o:'h',v:r.y+r.h,a:r.x,b:r.x+r.w,rot:180},
         {o:'v',v:r.x,a:r.y,b:r.y+r.h,rot:270},{o:'v',v:r.x+r.w,a:r.y,b:r.y+r.h,rot:90});
 });
 let best=null, bd=Math.max(i.h,0.5)+0.6;
 L.forEach(l=>{
  const along = l.o==='h'?cx:cy, d = Math.abs((l.o==='h'?cy:cx) - l.v);
  if(along < l.a-0.3 || along > l.b+0.3) return;
  if(d < bd){ bd=d; best=l; }
 });
 if(!best) return false;
 const cl = (v,a,b)=> b<a ? (a+b)/2 : Math.min(Math.max(v,a),b);
 let ncx=cx, ncy=cy;
 if(best.o==='h'){ ncy = best.rot===0 ? best.v+i.h/2 : best.v-i.h/2; ncx = cl(sn(cx), best.a+i.w/2, best.b-i.w/2); }
 else { ncx = best.rot===270 ? best.v+i.h/2 : best.v-i.h/2; ncy = cl(sn(cy), best.a+i.w/2, best.b-i.w/2); }
 i.rot = best.rot; i.x = ncx - i.w/2; i.y = ncy - i.h/2;
 return true;
}

  if(ptrs.size<2) return; const [a,b]=[...ptrs.values()];
  const d = Math.hypot(a.x-b.x,a.y-b.y);
  zoomAt((act.z*d/act.d)/view.z, (a.x+b.x)/2, (a.y+b.y)/2); return;
 }
 if(act.mode==='pan'){ view.x = act.vx + e.clientX - act.sx; view.y = act.vy + e.clientY - act.sy; applyView(); return; }
 const p = toWorld(e.clientX, e.clientY), i = act.i;
 let dx = p.x-act.sx, dy = p.y-act.sy;
 if(act.mode==='pending'){ if(Math.hypot(dx,dy) > 0.3) act.mode = 'box'; else return; }
 if(act.mode==='box'){ drawBox(act.sx, act.sy, p.x, p.y); act.ex = p.x; act.ey = p.y; act.moved = true; return; }
 if(act.mode==='move' && act.orig.size>1){
  // 여러 개 함께 이동: 잡은 항목 기준으로 격자 맞추고 같은 거리만큼
  const ddx = sn(act.ox+dx)-act.ox, ddy = sn(act.oy+dy)-act.oy;
  act.orig.forEach((o,id)=>{ const v = D.items.find(t=>t.id===id); if(v){ v.x = r2(o.x+ddx); v.y = r2(o.y+ddy); } });
  act.moved = true; schedRender(); return;
 }
 if(act.mode==='move'){
  i.x = sn(act.ox+dx); i.y = sn(act.oy+dy);
  if(i.kind==='door' && snap) snapDoor(i);
 }else if(i.kind==='door'){
  const a = -(i.rot||0)*Math.PI/180, lx = dx*Math.cos(a)-dy*Math.sin(a);
  i.w = Math.max(0.6, sn(act.ow+lx)); i.h = doorDepth(i);
 }else{
  // 회전된 항목은 로컬 좌표로 변환
  const a = -(i.rot||0)*Math.PI/180, lx = dx*Math.cos(a)-dy*Math.sin(a), ly = dx*Math.sin(a)+dy*Math.cos(a);
  i.w = Math.max(0.5, sn(act.ow+lx)); i.h = Math.max(0.5, sn(act.oh+ly));
 }
 act.moved = true;
 // 해당 항목만 다시 그림 (성능)
 const g = svg.querySelector(`[data-id="${i.id}"]`);
 if(g){ const t=document.createElementNS('http://www.w3.org/2000/svg','g'); t.innerHTML=itemSvg(i); g.replaceWith(t.firstChild); }
});
function endPtr(e){
 ptrs.delete(e.pointerId);
 if(!act) return;
 if(act.mode==='pinch'){ if(ptrs.size===0) act=null; return; }
 svg.classList.remove('panning');
 if(act.mode==='pending'){   // 장소 클릭 → 선택 추가/해제
  const id = act.i.id; selSet.has(id) ? selSet.delete(id) : selSet.add(id); syncSel(); render(); renderProp(); act = null; return;
 }
 if(act.mode==='box'){
  const bx = $('selbox'); if(bx) bx.remove();
  if(!act.moved || Math.hypot(act.ex-act.sx, act.ey-act.sy) < 0.2){ if(!selMode) {} else { setSel(null); render(); renderProp(); } act = null; return; }
  const L=Math.min(act.sx,act.ex), R=Math.max(act.sx,act.ex), T=Math.min(act.sy,act.ey), B=Math.max(act.sy,act.ey);
  const hit = D.items.filter(i=>{ const b = bbox(i);
   return i.kind==='zone' ? (b.l>=L && b.r<=R && b.t>=T && b.b<=B) : (b.cx>=L && b.cx<=R && b.cy>=T && b.cy<=B); });
  selSet = new Set([...act.base, ...hit.map(i=>i.id)]); syncSel(); render(); renderProp();
  if(hit.length) toast(`${selSet.size}개 선택됨`);
  act = null; return;
 }
 if(act.i){ if(act.moved){ render(); renderProp(); renderSummary(); save(); } else undo.pop(); }

}
let rafId = 0;
function schedRender(){ if(rafId) return; rafId = requestAnimationFrame(()=>{ rafId = 0; render(); }); }
function drawBox(x1,y1,x2,y2){
 const w = $('world'); if(!w) return;
 let b = $('selbox');
 if(!b){ b = document.createElementNS('http://www.w3.org/2000/svg','rect'); b.id='selbox'; b.setAttribute('fill','#3b82f6'); b.setAttribute('fill-opacity','.1'); b.setAttribute('stroke','#2563eb'); b.setAttribute('stroke-dasharray','6 4'); b.setAttribute('stroke-width', 1.5/view.z); w.appendChild(b); }
 b.setAttribute('x', Math.min(x1,x2)*S); b.setAttribute('y', Math.min(y1,y2)*S);
 b.setAttribute('width', Math.abs(x2-x1)*S); b.setAttribute('height', Math.abs(y2-y1)*S);
}

 if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); doUndo(); return; }
 if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){ e.preventDefault(); selSet = new Set(D.items.map(i=>i.id)); syncSel(); render(); renderProp(); toast(`${selSet.size}개 선택됨`); return; }
 const a = selItems(); if(!a.length) return;
 if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); delSel(); }
 else if(e.key.toLowerCase()==='r'){ rotateSel(); }
 else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d'){ e.preventDefault(); dupSel(); }
 else if(e.key.startsWith('Arrow')){
  e.preventDefault(); pushUndo(); const st = e.shiftKey?1:0.1;
  a.forEach(i=>{

   if(e.key==='ArrowUp') i.y=r2(i.y-st); if(e.key==='ArrowDown') i.y=r2(i.y+st);

});

  const f = photoIn.files[0]; photoIn.value=''; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ const im = new Image(); im.onload = ()=>{
    const m = 400, k = Math.min(1, m/Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);

   }; im.onerror=()=>toast('이미지를 읽을 수 없습니다'); im.src = r.result; };
  r.readAsDataURL(f);
 };
 photoIn.click();

/* ---------- 도면 저장소 (클라우드 db → 없으면 이 브라우저) ---------- */
const LKEY = 'ntl_layouts_v1', CKEY = 'ntl_layout_cur';
// [추가] QMS 안(iframe)에서 열리면 QMS 공유 시트에 저장 — 모든 QMS 사용자가 같은 도면·의견을 봄
const QB = (()=>{ try{ return (window.parent && window.parent!==window && window.parent.qmsLayoutBridge_) ? window.parent.qmsLayoutBridge_ : null; }catch(e){ return null; } })();
let curUpd = null;   // 지금 열린 도면을 불러오거나 저장했을 때의 수정일시 (다른 사람 저장 감지용)
let curId = null, dirty = false, loading = false, cloudPhotos = {};
try{ curId = localStorage.getItem(CKEY) || null; dirty = localStorage.getItem('ntl_layout_dirty')==='1'; }catch(e){}
function setCur(id){ curId = id; try{ id ? localStorage.setItem(CKEY,id) : localStorage.removeItem(CKEY); }catch(e){} }
const Store = {
 mode:'local', db:null, list:[], ready:true,
 readLocal(){ try{ return JSON.parse(localStorage.getItem(LKEY)||'[]'); }catch(e){ return []; } },
 writeLocal(a){ try{ localStorage.setItem(LKEY, JSON.stringify(a)); return true; }catch(e){ return false; } },
 init(){
  this.list = this.readLocal(); refreshStatus();
  if(QB){
   this.mode = 'qms'; this.ready = false; refreshStatus();
   let phSig = '';
   QB.subscribe(st=>{
    if(!st.ok){
     if(st.ready && this.mode==='qms' && !this.ready){ this.mode='local'; this.list=this.readLocal(); this.ready=true; refreshStatus(); toast('공유 저장소를 쓸 수 없어 이 PC에 저장합니다'+(st.err?' ('+st.err+')':'')); }
     return;
    }
    this.mode = 'qms'; this.ready = !!st.ready; this.list = st.list || [];
    const sig = Object.keys(st.photos||{}).sort().map(k=>k+':'+st.photos[k].length).join('|');
    if(sig !== phSig){ phSig = sig; cloudPhotos = {...(st.photos||{})}; D.photos = {...cloudPhotos}; buildPalette(); }
    Talk.list = st.talk || [];
    refreshStatus(); refreshOpenModals(); remoteCheck(); render(); renderTalk();
   });
   return;
  }
  let p; try{ p = window.claude && claude.use ? claude.use('db') : null; }catch(e){ p = null; }
  if(!p) return;
  p.then(db=>{
   if(!db) return;
   this.db = db; this.mode = 'cloud'; this.ready = false; refreshStatus();
   const t = setTimeout(()=>{ if(!this.ready) toast('클라우드 연결이 늦어지고 있습니다'); }, 10000);
   db.collection('layouts').onSnapshot(snap=>{
    clearTimeout(t); this.ready = true;
    this.list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    refreshStatus(); refreshOpenModals();
   }, ()=>{ clearTimeout(t); this.db=null; this.mode='local'; this.list=this.readLocal(); this.ready=true; refreshStatus(); toast('클라우드 연결 실패 — 이 브라우저에 저장합니다'); });
   db.collection('photos').onSnapshot(snap=>{
    const ph = {}; snap.docs.forEach(d=>{ const v = d.data(); if(v && v.url) ph[d.id] = v.url; });
    cloudPhotos = ph; D.photos = {...ph}; buildPalette(); render(); renderProp();
   }, ()=>{});
  }).catch(()=>{});
 },
 async save(id, name, data, upd){
  const rec = {name, updated:upd||new Date().toISOString(), eqCount:data.items.filter(i=>i.kind==='eq').length};
  if(this.mode==='qms'){
   const d = {...data}; delete d.photos;
   await QB.save(id, {...rec, data:JSON.stringify(d)});
  }else if(this.mode==='cloud'){
   const d = {...data}; delete d.photos;      // 사진은 photos 컬렉션에 따로 저장
   await this.db.collection('layouts').doc(id).set({...rec, data:JSON.stringify(d)});
  }else{
   const a = this.readLocal().filter(r=>r.id!==id); a.push({id, ...rec, data:JSON.stringify(data)});
   if(!this.writeLocal(a)) throw {code:'local_full'};
   this.list = a;
  }
 },
 async remove(id){
  if(this.mode==='qms') await QB.remove(id);
  else if(this.mode==='cloud') await this.db.collection('layouts').doc(id).delete();
  else { const a = this.readLocal().filter(r=>r.id!==id); this.writeLocal(a); this.list = a; }
 },
 get(id){
  const r = this.list.find(r=>r.id===id); if(!r) return null;
  if(r.data==null) return null;
  try{ const d = Object.assign(blank(), JSON.parse(r.data)); if(this.mode!=='local') d.photos = {...cloudPhotos}; return d; }catch(e){ return null; }
 },
 async savePhoto(type, url){
  if(this.mode==='qms'){ try{ await QB.savePhoto(type, url); }catch(e){ toast(e && e.code==='too_big' ? '사진 용량이 커서 공유 저장 실패' : '사진 공유 저장 실패'); } return; }
  if(this.mode!=='cloud') return;
  try{ const ref = this.db.collection('photos').doc(type); url ? await ref.set({url}) : await ref.delete(); }
  catch(e){ toast(e && e.code==='invalid_argument' ? '사진 용량이 커서 클라우드 저장 실패' : '사진 클라우드 저장 실패'); }
 }
};

 // [추가] 내가 연 뒤에 다른 사람이 같은 도면을 저장했으면 덮어쓰기 전에 확인
 const r0 = curRec();
 if(!asNew && !force && Store.mode==='qms' && r0 && curUpd && r0.updated!==curUpd){
  confirmBox(`${r0.by||'다른 사용자'}님이 ${fmtD(r0.updated)}에 이 도면을 저장했습니다. 내 내용으로 덮어쓸까요? (취소 후 "새로 불러오기" 또는 "새 도면으로 저장" 가능)`, ()=>saveCurrent(false, true)); return;
 }
 let name = (D.title||'').trim() || '이름 없는 도면', id = curId;
 if(asNew || !id || !Store.list.some(r=>r.id===id)){
  id = uid();

 }
 D.title = name; syncHead(); render();
 try{
  const upd = new Date().toISOString(), oldUpd = curUpd, oldCur = curId;
  setCur(id); curUpd = upd;
  try{ await Store.save(id, name, D, upd); }catch(e2){ curUpd = oldUpd; setCur(oldCur); throw e2; }
  dirty = false; hideRemote(); try{ localStorage.setItem('ntl_layout_dirty',''); }catch(e){}
  refreshStatus(); toast(`"${name}" 저장됨`); if($('mList').classList.contains('on')) renderList();
 }catch(e){
  toast(e && e.code==='too_big' ? '도면 용량이 커서 공유 저장 실패 (설비 수를 나눠 저장하세요)' : e && e.code==='local_full' ? '브라우저 저장공간 부족 — 내보내기로 백업하세요'
      : e && e.code==='invalid_argument' ? '도면 용량이 커서 저장 실패' : e && e.code==='quota_exceeded' ? '저장 공간이 가득 찼습니다. 안 쓰는 도면을 삭제하세요' : '저장 실패');
 }
}

const ctr = e=>[e.x+e.w/2, e.y+e.h/2];

  if(dist>0.05 || (a.rot||0)!==(b.rot||0) || za!==zb) rows.push({k:'이동', a, b, dist, za, zb});
  else same++;
 });
 ea.forEach(a=>{ if(!mB.has(key(a))) rows.push({k:'제거', a}); });

 rows.sort((x,y)=>ord[x.k]-ord[y.k] || eqName(x.b||x.a).localeCompare(eqName(y.b||y.a)));

  let i = 0, first = true;
  do{
   sl = pptx.addSlide(); head(sl, '설비 변경 내역' + (first?'':' (계속)')); let y = 0.95;
   if(first){ sl.addText(sum,{x:0.35,y,w:W-0.7,h:0.35,fontFace:F,fontSize:12,bold:true}); y += 0.45;
    if(tTypes){ const cw=Math.min(1.3,(W-0.7-1.2)/df.types.length); sl.addTable(tTypes,{x:0.35,y,w:1.2+cw*df.types.length,colW:[1.2,...df.types.map(()=>cw)],fontFace:F,fontSize:10,border:{type:'solid',pt:0.5,color:'CBD5E1'},rowH:0.3}); y += 1.4; } }
   const per = Math.max(4, Math.floor((7.05 - y - 0.3)/0.3));
   const part = rows.slice(i, i+per); i += per;
   if(part.length) sl.addTable([hdr,...part],{x:0.35,y,w:colW.reduce((a,b)=>a+b,0),colW,fontFace:F,fontSize:10,border:{type:'solid',pt:0.5,color:'CBD5E1'},rowH:0.3});
   else if(first) sl.addText('설비 배치 변경 없음',{x:0.35,y,w:6,h:0.4,fontFace:F,fontSize:12,color:'94A3B8'});
   first = false;
  }while(i < rows.length);
  await pptx.writeFile({fileName:`설비배치_전후비교_${today.replace(/-/g,'')}.pptx`});
  window.__lastPptx = pptx; toast('PPT 다운로드');
  }catch(e){ toast('PPT 만들기 실패: '+(e&&e.message||e)); }
 });
};
/* ---------- [추가] 의견 (같이 보며 이야기) ---------- */
const Talk = {list:[], pick:false, pos:null, hi:null, filter:'open'};
function talkFor(){ return Talk.list.filter(t=>t.lid===curId).sort((a,b)=>String(a.at).localeCompare(String(b.at))); }
function talkPins(){
 if(Store.mode!=='qms' || !curId) return '';
 const L = talkFor(); let g = '';
 L.forEach((t,n)=>{
  const x = parseFloat(t.x), y = parseFloat(t.y); if(isNaN(x)||isNaN(y)) return;
  const done = t.done==='1', on = Talk.hi===t.id, cx = x*S, cy = y*S;
  if(done && Talk.filter==='open' && !on) return;
  g += `<g data-talk="${t.id}" style="cursor:pointer"><path d="M${cx} ${cy} l-9 -16 a11 11 0 1 1 18 0 z" fill="${done?'#94a3b8':'#dc2626'}" stroke="${on?'#f97316':'#fff'}" stroke-width="${on?4:2}"/><text x="${cx}" y="${cy-20}" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff" pointer-events="none">${n+1}</text></g>`;
 });
 if(Talk.pos) g += `<g pointer-events="none"><circle cx="${Talk.pos.x*S}" cy="${Talk.pos.y*S}" r="14" fill="#f97316" fill-opacity=".25" stroke="#f97316" stroke-width="3" stroke-dasharray="5 3"/><circle cx="${Talk.pos.x*S}" cy="${Talk.pos.y*S}" r="3" fill="#f97316"/></g>`;
 return g;
}
function talkWho(){ let w=''; try{ w = (QB && QB.me && QB.me()) || localStorage.getItem('ntl_layout_who') || ''; }catch(e){} return w; }
function talkPickOff(){ Talk.pick=false; $('pickTip').classList.remove('on'); $('tpPin').classList.remove('on'); }
function renderTalk(){
 const L = curId ? talkFor() : [], open = L.filter(t=>t.done!=='1').length;
 $('talkN').textContent = (Store.mode==='qms' && open) ? `(${open})` : '';
 if(!$('talkPanel').classList.contains('on')) return;
 const r = curRec();
 $('tpTitle').textContent = r ? r.name : '';
 if(Store.mode!=='qms'){ $('tpList').innerHTML = '<div class="empty">의견 기능은 QMS 안(기준정보 ▸ 설비 배치도)에서 열었을 때 쓸 수 있습니다.</div>'; $('tpNew').style.display='none'; $('tpCnt').textContent=''; return; }
 if(!r){ $('tpList').innerHTML = '<div class="empty">먼저 도면을 저장하세요. 저장된 도면에만 의견을 남길 수 있습니다.</div>'; $('tpNew').style.display='none'; $('tpCnt').textContent=''; return; }
 $('tpNew').style.display='';
 $('tpCnt').textContent = `미해결 ${open} · 전체 ${L.length}`;
 const show = L.map((t,n)=>({t,n})).filter(o=>Talk.filter==='all' || o.t.done!=='1' || o.t.id===Talk.hi);
 $('tpList').innerHTML = show.length ? show.map(({t,n})=>{
  const done = t.done==='1', pin = t.x!==''&&t.x!=null&&!isNaN(parseFloat(t.x));
  return `<div class="tp-it ${done?'done':''} ${Talk.hi===t.id?'hi':''}" data-tid="${t.id}"><div class="tp-m"><span class="tp-no">${n+1}</span><b>${esc(t.by||'')}</b><small>${fmtD(t.at)}</small>${pin?'📍':''}</div><div class="tp-t">${esc(t.text)}</div>
   <div class="tp-a">${pin?'<button data-go>위치로</button>':''}<button data-done>${done?'다시 열기':'✔ 해결'}</button><button data-del style="color:#dc2626">삭제</button></div>${done&&t.doneBy?`<small class="empty">해결: ${esc(t.doneBy)}</small>`:''}</div>`;
 }).join('') : `<div class="empty">${L.length?'미해결 의견이 없습니다. "전체"를 고르면 해결된 의견도 보입니다.':'아직 의견이 없습니다. 아래에 입력하고, 필요하면 📍로 위치를 찍으세요.'}</div>`;
 $('tpList').querySelectorAll('[data-tid]').forEach(el=>{
  const t = Talk.list.find(v=>v.id===el.dataset.tid); if(!t) return;
  const go = el.querySelector('[data-go]'); if(go) go.onclick = ()=>talkGo(t);
  el.querySelector('[data-done]').onclick = ()=>{ const d = t.done==='1'; QB.talkSet(t.id, {done:d?'':'1', doneBy:d?'':(talkWho()||'')}); };
  el.querySelector('[data-del]').onclick = ()=>confirmBox('이 의견을 삭제할까요?', ()=>QB.talkDel(t.id));
 });
 $('tpPos').textContent = Talk.pos ? `위치 (${Talk.pos.x}, ${Talk.pos.y})m ✕` : '';
}
function talkGo(t){
 const x = parseFloat(t.x), y = parseFloat(t.y); if(isNaN(x)||isNaN(y)) return;
 const r = svg.getBoundingClientRect(), wide = window.innerWidth>900 && $('talkPanel').classList.contains('on') ? 340 : 0, tall = window.innerWidth<=900 && $('talkPanel').classList.contains('on') ? window.innerHeight*0.62 : 0;
 if(view.z < 0.6) view.z = 0.8;
 view.x = (r.width-wide)/2 - x*S*view.z; view.y = (r.height-tall)/2 - y*S*view.z + 20; Talk.hi = t.id; render(); renderTalk();
}
function talkOpenItem(id){ $('talkPanel').classList.add('on'); Talk.hi = id; render(); renderTalk(); const el = $('tpList').querySelector(`[data-tid="${id}"]`); if(el) el.scrollIntoView({block:'nearest'}); }
$('bTalk').onclick = ()=>{ const p=$('talkPanel'); p.classList.toggle('on'); if(!p.classList.contains('on')){ talkPickOff(); Talk.pos=null; Talk.hi=null; render(); } $('tpWho').value = talkWho(); renderTalk(); };
$('tpClose').onclick = ()=>{ $('talkPanel').classList.remove('on'); talkPickOff(); Talk.pos=null; Talk.hi=null; render(); };
$('tpFilter').onchange = e=>{ Talk.filter = e.target.value; render(); renderTalk(); };
$('tpPin').onclick = ()=>{ if(Talk.pick){ talkPickOff(); return; } Talk.pick = true; $('pickTip').classList.add('on'); $('tpPin').classList.add('on'); if(window.innerWidth<=900) toast('도면에서 위치를 누르세요'); };
$('tpPos').onclick = ()=>{ Talk.pos=null; render(); renderTalk(); };
$('tpWho').onchange = e=>{ try{ localStorage.setItem('ntl_layout_who', e.target.value.trim()); }catch(_){} };
$('tpAdd').onclick = ()=>{
 const text = $('tpText').value.trim(), who = $('tpWho').value.trim();
 if(!text){ toast('의견을 입력하세요'); return; }
 if(!who){ toast('이름을 입력하세요'); $('tpWho').focus(); return; }
 try{ localStorage.setItem('ntl_layout_who', who); }catch(_){}
 QB.talkAdd({lid:curId, x:Talk.pos?Talk.pos.x:'', y:Talk.pos?Talk.pos.y:'', text, by:who});
 $('tpText').value=''; Talk.pos=null; render(); renderTalk(); toast('의견 등록됨 — 다른 사용자 화면에도 곧 보입니다');
};
/* ---------- [추가] 다른 사람이 저장한 내용 감지 ---------- */
function hideRemote(){ $('rbar').classList.remove('on'); }
function reloadCur(r){
 const d = Store.get(r.id); if(!d) return;
 const keep = new Set(selSet); loading = true; D = d; selSet = new Set([...keep].filter(id=>D.items.some(i=>i.id===id))); syncSel(); syncHead(); buildPalette(); changed(); loading = false;
 dirty = false; try{ localStorage.setItem('ntl_layout_dirty',''); }catch(e){} curUpd = r.updated; hideRemote(); refreshStatus();
}
function remoteCheck(){
 if(Store.mode!=='qms' || !Store.ready) return;
 const r = curRec(); if(!r || r.data==null || r.stale) return;
 if(curUpd===null){ if(!dirty){ reloadCur(r); } else curUpd = r.updated; return; }   // 처음 열 때: 공유본이 최신
 if(r.updated===curUpd) return;
 if(!dirty){ reloadCur(r); toast(`${r.by||'다른 사용자'}님이 저장한 내용으로 새로 고쳤습니다`); }
 else { $('rbarT').textContent = `⚠ ${r.by||'다른 사용자'}님이 ${fmtD(r.updated)}에 이 도면을 저장했습니다 (내 화면은 수정 중)`; $('rbar').classList.add('on'); }
}
$('rbarLoad').onclick = ()=>{ const r = curRec(); if(!r) return; confirmBox('내가 수정한 내용은 사라집니다. 새로 불러올까요?', ()=>{ pushUndo(); reloadCur(r); toast('새로 불러왔습니다 (Ctrl+Z로 내 수정 되돌리기 가능)'); }); };
$('rbarHide').onclick = hideRemote;

/* ---------- 시작 ---------- */
D = load();
buildPalette(); syncHead(); loading = true; changed(); loading = false; Store.init();
requestAnimationFrame(fit);
window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(fit,200); });
</script>
</body>
